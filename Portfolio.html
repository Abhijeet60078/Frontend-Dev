<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio - Abhijeet Mishra</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="portfolio.css">
</head>

<body class="bg-light text-dark">

<header class="py-4 bg-white shadow-sm">
    <div class="container text-center">
        <h1 class="fw-bold mb-2">Abhijeet Mishra</h1>
        <p class="lead mb-0">Full Stack Developer • AI Enthusiast • Problem Solver</p>
    </div>
</header>

<main class="container mt-4">

    <section class="text-center">
        <img src="https://via.placeholder.com/200" class="img-fluid rounded-circle mb-3 profile-img" alt="Profile Photo">
        <div class="d-flex justify-content-center gap-3 mb-4">
            <a href="#" class="btn btn-primary px-4">Hire Me</a>
            <a href="#" class="btn btn-outline-dark px-4">Download CV</a>
        </div>
    </section>

    <section class="p-5 bg-white rounded shadow-sm mt-4">
        <h2 class="fw-bold text-center mb-3">Contact Me</h2>
        <form class="mt-3">
            <div class="mb-3">
                <input type="text" class="form-control" placeholder="Your Name">
            </div>

            <div class="mb-3">
                <input type="email" class="form-control" placeholder="Your Email">
            </div>

            <div class="mb-3">
                <textarea class="form-control" rows="4" placeholder="Write your message..."></textarea>
            </div>

            <div class="text-center">
                <button class="btn btn-success px-4">Send Message</button>
            </div>
        </form>
    </section>

</main>

<footer class="py-3 text-center mt-4 bg-white">
    <p class="m-0">© 2025 Abhijeet Mishra. All Rights Reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
