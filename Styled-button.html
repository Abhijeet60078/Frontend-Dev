<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Button Styles</title>
<style>
body { font-family: Arial, sans-serif; padding:30px; }
.row { display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
button { padding:10px 18px; border-radius:8px; border:none; cursor:pointer; box-shadow:0 6px 14px rgba(0,0,0,0.08); transition: all .25s ease; font-size:14px; }
button.primary { background:#007bff; color:#fff; }
button.primary:hover { transform:translateY(-4px); box-shadow:0 12px 24px rgba(0,123,255,0.18); }
button.secondary { background:#6c757d; color:#fff; }
button.outline { background:transparent; color:#007bff; border:2px solid #007bff; }
button.outline:hover { background:#007bff; color:#fff; }
button:active { transform:translateY(1px); }
button:focus { outline:3px solid #a9d3ff; outline-offset:3px; }
button[disabled] { opacity:0.5; cursor:not-allowed; box-shadow:none; transform:none; }
.container { margin-top:12px; }
</style>
</head>
<body>
<h1>Button Collection</h1>
<div class="row container">
  <button class="primary">Primary</button>
  <button class="secondary">Secondary</button>
  <button class="outline">Outline</button>
  <button disabled>Disabled</button>
  <button class="primary" style="width:140px;">Focus me (tab)</button>
</div>
</body>
</html>
