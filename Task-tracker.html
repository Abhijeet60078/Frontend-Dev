<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="Task-tracker.css">
</head>

<body class="bg-light">

<header class="bg-dark text-white py-4 text-center">
    <h1 class="fw-bold m-0">Task Tracker</h1>
    <p class="m-0 mt-2 fs-5">Pending Tasks <span class="badge bg-warning text-dark fs-6">3</span></p>
</header>

<main class="container my-5">

    <section class="row justify-content-center">
        <div class="col-md-6">

            <ul class="list-group shadow-sm">

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Design homepage UI
                    <span class="badge bg-danger">High</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Write API documentation
                    <span class="badge bg-warning text-dark">Medium</span>
                </li>

                <li class="list-group-item d-flex justify-content-between align-items-center">
                    Optimize images for website
                    <span class="badge bg-success">Low</span>
                </li>

            </ul>

            <div class="text-center mt-4">
                <button class="btn btn-primary px-4">
                    Completed <span class="badge bg-light text-dark ms-2">0</span>
                </button>
            </div>

        </div>
    </section>

</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="m-0">© 2025 Task Tracker App</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
