<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Box-Sizing Comparison</title>
<style>
body { font-family: Arial; display:flex; flex-direction:column; align-items:center; padding:30px; gap:20px; }
.wrapper { display:flex; gap:20px; flex-wrap:wrap; justify-content:center; }
.box { width:250px; padding:30px; border:6px solid #333; background:#fff; text-align:center; }
.default { background:#fff1f0; }
.borderbox { box-sizing:border-box; background:#f0fff6; }
.note { max-width:700px; text-align:center; color:#444; }
@media (max-width:700px) { .wrapper { flex-direction:column; } }
</style>
</head>
<body>
<h1>box-sizing Comparison</h1>
<div class="wrapper">
  <div class="box default">Default (content-box)<br>width excludes border & padding</div>
  <div class="box borderbox">box-sizing: border-box;<br>width includes border & padding</div>
</div>
<p class="note">When using equal width + padding, content-box adds to total size while border-box keeps the total width constant. Resize the viewport to see responsiveness.</p>
</body>
</html>
