<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Combined Effects</title>
<style>
body { font-family: Arial; padding:30px; }
.row { display:flex; gap:18px; flex-wrap:wrap; }
.btn { padding:12px 18px; border-radius:10px; border:1px solid #ccc; cursor:pointer; transition: all .25s ease; background:#fff; box-shadow:0 8px 18px rgba(0,0,0,0.06); }
.btn:hover { transform:scale(1.06); box-shadow:0 18px 36px rgba(0,0,0,0.12); background:#007bff; color:#fff; border-color:transparent; }
.btn:active { transform:scale(0.98); }
.btn:focus { outline:3px solid #cfe8ff; outline-offset:3px; }
</style>
</head>
<body>
<h1>Combined Effects</h1>
<div class="row">
  <button class="btn">Grow & Color</button>
  <button class="btn">Shadow Lift</button>
  <button class="btn">Scale & Focus</button>
  <button class="btn" disabled style="opacity:.5; cursor:not-allowed;">Disabled</button>
</div>
</body>
</html>
