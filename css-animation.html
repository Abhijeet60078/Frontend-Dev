<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Animations Demo</title>
<style>
body { height:100vh; margin:0; display:flex; align-items:center; justify-content:center; font-family:Arial; background:linear-gradient(180deg,#f8f9fb,#eef2fb); }
.grid { display:flex; gap:22px; align-items:center; }
.box { width:110px; height:110px; display:flex; align-items:center; justify-content:center; border-radius:10px; color:#fff; font-weight:700; }
.move { background:#ff7a7a; animation: slide 2s ease-in-out infinite alternate; animation-delay:0s; }
@keyframes slide { from { transform:translateX(0); } to { transform:translateX(40px); } }
.bounce { background:#6c9cff; animation: bounce 1s cubic-bezier(.2,.8,.2,1) infinite; animation-delay: .2s; }
@keyframes bounce { 0%{ transform:translateY(0);} 50%{ transform:translateY(-30px);} 100%{ transform:translateY(0);} }
.color { background:#8be28b; animation: hue 3s ease-in-out infinite alternate; animation-delay:.4s; }
@keyframes hue { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(160deg); } }
</style>
</head>
<body>
<div class="grid">
  <div class="box move">Slide</div>
  <div class="box bounce">Bounce</div>
  <div class="box color">Hue</div>
</div>
</body>
</html>
