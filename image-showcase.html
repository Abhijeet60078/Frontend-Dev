<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Image Showcase</title>
<style>
body { font-family: Arial, sans-serif; padding:24px; margin:0; }
.gallery { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; }
figure { margin:0; position:relative; overflow:hidden; border-radius:10px; box-shadow:0 6px 18px rgba(0,0,0,0.12); }
figure img { width:100%; height:220px; object-fit:cover; display:block; transition:transform .25s ease; }
figure:hover img { transform:scale(1.08); }
figure::after { content:""; position:absolute; inset:0; background:rgba(0,0,0,0); transition:background .25s ease; }
figure:hover::after { background:rgba(0,0,0,0.25); }
figcaption { padding:10px; background:#fff; text-align:center; font-size:14px; }
@media (max-width:700px) { .gallery { grid-template-columns: 1fr; } img { height:200px; } }
</style>
</head>
<body>
<h1>Image Showcase</h1>
<div class="gallery">
  <figure><img src="https://via.placeholder.com/600x400?text=1" alt=""><figcaption>Caption 1</figcaption></figure>
  <figure><img src="https://via.placeholder.com/600x400?text=2" alt=""><figcaption>Caption 2</figcaption></figure>
  <figure><img src="https://via.placeholder.com/600x400?text=3" alt=""><figcaption>Caption 3</figcaption></figure>
  <figure><img src="https://via.placeholder.com/600x400?text=4" alt=""><figcaption>Caption 4</figcaption></figure>
  <figure><img src="https://via.placeholder.com/600x400?text=5" alt=""><figcaption>Caption 5</figcaption></figure>
  <figure><img src="https://via.placeholder.com/600x400?text=6" alt=""><figcaption>Caption 6</figcaption></figure>
</div>
</body>
</html>
