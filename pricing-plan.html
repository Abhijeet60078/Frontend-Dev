<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans - CloudSuite</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="pricing-plan.css">
</head>

<body class="bg-light">

<header class="py-4 bg-dark text-white text-center">
    <h1 class="fw-bold m-0">Choose Your Plan</h1>
</header>

<main class="container my-5">

    <section class="row g-4">

        <div class="col-md-4">
            <div class="card pricing-card text-center p-3 shadow-sm h-100">
                <h3 class="fw-bold mb-3">Basic</h3>
                <p class="display-5 fw-bold">$9</p>
                <p class="text-muted">per month</p>
                <ul class="list-unstyled mt-3 mb-4">
                    <li>5GB Storage</li>
                    <li>Email Support</li>
                    <li>Single User Access</li>
                </ul>
                <button class="btn btn-outline-primary w-100">Select Plan</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card pricing-card pro-card text-center p-3 shadow-sm h-100 bg-primary text-white">
                <h3 class="fw-bold mb-3">Pro</h3>
                <p class="display-5 fw-bold">$29</p>
                <p>per month</p>
                <ul class="list-unstyled mt-3 mb-4">
                    <li>50GB Storage</li>
                    <li>Priority Support</li>
                    <li>Team Access</li>
                </ul>
                <button class="btn btn-light w-100">Select Plan</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card pricing-card text-center p-3 shadow-sm h-100">
                <h3 class="fw-bold mb-3">Enterprise</h3>
                <p class="display-5 fw-bold">$99</p>
                <p class="text-muted">per month</p>
                <ul class="list-unstyled mt-3 mb-4">
                    <li>Unlimited Storage</li>
                    <li>Dedicated Manager</li>
                    <li>Multi-Team Access</li>
                </ul>
                <button class="btn btn-outline-primary w-100">Select Plan</button>
            </div>
        </div>

    </section>

</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="m-0">© 2025 CloudSuite Solutions</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
