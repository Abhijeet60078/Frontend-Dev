<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog - Tech Store</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-catalog.css">
</head>

<body class="bg-light">

<header class="py-3 bg-dark text-white">
    <div class="container d-flex justify-content-between align-items-center">
        <h2 class="fw-bold m-0">Tech Store</h2>
        <nav>
            <ul class="nav d-none d-md-flex">
                <li class="nav-item"><a class="nav-link text-white" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Products</a></li>
                <li class="nav-item"><a class="nav-link text-white" href="#">Contact</a></li>
            </ul>
        </nav>
    </div>
</header>

<main class="container py-5">

    <h1 class="fw-bold text-center mb-5">Latest Products</h1>

    <section>
        <div class="row g-4">

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Wireless Headphones</h5>
                        <p class="text-muted mb-2">$59.99</p>
                        <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Smart Watch</h5>
                        <p class="text-muted mb-2">$89.99</p>
                        <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Bluetooth Speaker</h5>
                        <p class="text-muted mb-2">$39.99</p>
                        <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>

            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm">
                    <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Product">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold">Gaming Keyboard</h5>
                        <p class="text-muted mb-2">$49.99</p>
                        <a href="#" class="btn btn-primary w-100">Add to Cart</a>
                    </div>
                </div>
            </div>

        </div>
    </section>

</main>

<footer class="bg-dark text-white text-center py-3">
    <p class="m-0">© 2025 Tech Store. All rights reserved.</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
