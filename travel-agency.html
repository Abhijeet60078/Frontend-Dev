<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TravelWorld - Explore More</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="travel-agency.css">
</head>

<body class="bg-light">

<header class="py-4 bg-dark text-white text-center">
    <h1 class="fw-bold m-0">TravelWorld</h1>
    <p class="m-0 mt-1">Discover Your Next Adventure</p>
</header>

<main class="container my-5">

    <section class="mb-5">

        <div id="travelCarousel" class="carousel slide shadow-sm" data-bs-ride="carousel">

            <div class="carousel-inner">

                <div class="carousel-item active" data-bs-interval="2000">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e" class="d-block w-100 carousel-img" alt="Beach">
                    <div class="carousel-caption">
                        <h3 class="fw-bold">Maldives</h3>
                        <p>Relax on crystal-clear beaches</p>
                    </div>
                </div>

                <div class="carousel-item" data-bs-interval="3000">
                    <img src="https://images.unsplash.com/photo-1483683804023-6ccdb62f86ef" class="d-block w-100 carousel-img" alt="Mountains">
                    <div class="carousel-caption">
                        <h3 class="fw-bold">Swiss Alps</h3>
                        <p>Experience breathtaking mountain views</p>
                    </div>
                </div>

                <div class="carousel-item" data-bs-interval="2500">
                    <img src="https://images.unsplash.com/photo-1505761671935-60b3a7427bad" class="d-block w-100 carousel-img" alt="City">
                    <div class="carousel-caption">
                        <h3 class="fw-bold">New York</h3>
                        <p>The city that never sleeps</p>
                    </div>
                </div>

            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#travelCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#travelCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>

        </div>

    </section>

    <section class="mt-4">
        <h4 class="fw-bold text-center mb-3">Booking Completion</h4>

        <div class="progress" style="height: 25px;">
            <div class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 70%;">70%</div>
        </div>
    </section>

</main>

<footer class="bg-dark text-white text-center py-3 mt-5">
    <p class="m-0">TravelWorld • contact@travelworld.com • +1 445 889 2211</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
