<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>UI Components</title>
<style>
body { font-family: Arial, sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:linear-gradient(135deg,#fdfbfb,#e6f7ff); }
.card { width:420px; padding:20px; border-radius:12px; box-shadow:0 12px 30px rgba(0,0,0,0.08); background:#fff; display:flex; flex-direction:column; gap:12px; }
.input { display:flex; gap:8px; }
input[type="search"] { flex:1; padding:10px 12px; border-radius:8px; border:1px solid #ddd; }
button { padding:10px 14px; border-radius:8px; border:none; background:#007bff; color:#fff; cursor:pointer; }
select { padding:10px; border-radius:8px; border:1px solid #ddd; }
input:focus, select:focus, button:focus { outline:3px solid #cfe8ff; outline-offset:2px; }
</style>
</head>
<body>
<div class="card">
  <div class="input">
    <input type="search" placeholder="Search...">
    <button>Search</button>
  </div>
  <div style="display:flex; gap:8px;">
    <button>Primary</button>
    <button style="background:#6c757d">Secondary</button>
    <select>
      <option>Option A</option>
      <option>Option B</option>
      <option>Option C</option>
    </select>
  </div>
  <small style="color:#666">Focused elements highlight for accessibility.</small>
</div>
</body>
</html>
